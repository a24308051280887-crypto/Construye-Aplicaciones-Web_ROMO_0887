<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con limitaciones</title>
</head>
<body>

<h2>Formulario con limitaciones</h2>

<form action="" method="post">

Ingresa tu nombre:

<!-- Deesahbilitacion de campo -->

<input type="text" name="nombre" disabled>

<br>

<!-- Limitacion de caracteres -->

Contraseña:
<input type="password" name="pass" maxlength="5">

<br>

<!-- Solo lectura -->

Comentarios:
<textarea name="comentarios" readonly>

Este es mi comentario y no se puede borrar

</textarea>

<br>

</form>

</body>
</html>
