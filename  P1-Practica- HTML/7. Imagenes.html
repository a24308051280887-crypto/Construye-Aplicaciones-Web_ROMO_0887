<!DOCTYPE html> <!-- Indica que es un documento HTML -->
<html lang="en"> <!-- Se abre el html -->
<head> <!-- Es el encabezado -->
    <meta charset="UTF-8"> <!-- Le indica como usar los caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Esto le da la estructura a la pagina dandole el tamano -->
    <title>Imagenes en HTML</title> <!-- Es el titulo que se vera en la pestana -->
</head> <!-- Se cierra el encabezado -->
<body> <!-- Es el contenido de la pagina -->
    <h2>Imagenes en HTML</h2> <!-- Subtitulo "Imagenes en HTML" -->
    <h3>Locales</h3> <!-- Subtitulo que indica que son imagenes locales -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Muestra una imagen local de una carita feliz -->
    <h3>Locales redismensionado</h3> <!-- Subtitulo que indica que son imagenes locales redimensionadas -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Muestra una imagen local con un tamano diferente -->
    <h3>Desde internet</h3> <!-- Subtitulo que indica que la imagen viene de internet -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!-- Muestra una imagen obtenida desde internet -->
    <h3>Animaciones</h3> <!-- Subtitulo que indica que se mostraran animaciones -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!-- Muestra una imagen animada desde internet -->
</body> <!-- Se cierra el contenido de la pagina -->
</html> <!-- Se cierra el html -->
